<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#15131F; --surface:#1E1B2E; --surface-2:#282440; --ink:#F4F2FB; --ink-soft:#B4AFC9; --line:#332E4C;
  --blue:#3D6CFF; --purple:#9B4DFF; --pink:#FF4DA6; --grad:linear-gradient(115deg,var(--blue),var(--purple) 55%,var(--pink));
  --ok:#3FCE83; --bad:#FF5C7A; --warn:#FFB13F;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',sans-serif;}
h1,h2,h3{font-family:'Baloo 2',sans-serif;}
.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 60px;}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:10px;flex-wrap:wrap;}
.brand{font-weight:800;font-size:20px;display:flex;align-items:center;gap:9px;}
.brand-mark{width:32px;height:32px;border-radius:50%;background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none;overflow:hidden;}
.brand-mark img{width:100%;height:100%;object-fit:cover;display:block;}
.brand span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
.btn{border:none;cursor:pointer;font-weight:700;border-radius:10px;padding:9px 15px;font-size:13.5px;font-family:inherit;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--grad);color:#fff;}
.btn-ghost{background:var(--surface-2);color:var(--ink);}
.btn-ok{background:var(--ok);color:#0a2617;}
.btn-bad{background:var(--bad);color:#2a0510;}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px;}
.stat-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;}
.stat-box b{display:block;font-size:22px;font-family:'Baloo 2';background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
.stat-box span{font-size:11.5px;color:var(--ink-soft);font-weight:600;}
.tabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap;}
.tabs button{background:var(--surface-2);border:1px solid var(--line);color:var(--ink-soft);padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;}
.tabs button.active{background:var(--grad);color:#fff;border-color:transparent;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;}
.row{display:flex;gap:14px;align-items:flex-start;}
.thumb{width:88px;height:88px;border-radius:12px;object-fit:cover;background:var(--surface-2);flex:none;cursor:pointer;}
.meta{flex:1;min-width:0;}
.meta b{font-size:15px;}
.meta .sub{color:var(--ink-soft);font-size:12.5px;margin-top:2px;}
.tagx{display:inline-block;background:var(--surface-2);color:var(--ink-soft);font-size:11px;padding:2px 8px;border-radius:999px;margin-left:4px;}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.badge{font-size:11px;padding:3px 10px;border-radius:999px;font-weight:700;}
.badge.pending{background:#3a2e12;color:var(--warn);}
.badge.approved{background:#123a24;color:var(--ok);}
.badge.rejected{background:#3a1220;color:var(--bad);}
.role-badge{font-size:13px;margin-right:3px;vertical-align:-2px;}
.role-badge-img{width:15px;height:15px;object-fit:contain;vertical-align:-3px;margin-right:3px;}
.role-badge.owner{color:#FF8A3D;}
.role-badge.admin{color:var(--blue);}
.role-badge.artist{color:var(--purple);}
.role-badge.verified{color:var(--pink);}
.select-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.select-row input[type=checkbox]{width:16px;height:16px;}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.filter-bar input,.filter-bar select{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--ink);font-family:inherit;font-size:13px;}
.filter-bar input[type=search]{flex:1;min-width:160px;}
.bulk-bar{position:sticky;top:0;z-index:5;background:var(--surface);border:1px solid var(--purple);border-radius:12px;padding:10px 14px;margin-bottom:12px;display:none;align-items:center;justify-content:space-between;gap:10px;}
.bulk-bar.show{display:flex;}
.item-check{width:18px;height:18px;margin-top:4px;flex:none;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px;font-weight:700;}
.field input,.field select,.field textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--ink);font-family:inherit;font-size:14px;}
.login-box{max-width:380px;margin:80px auto;background:var(--surface);padding:28px;border-radius:18px;border:1px solid var(--line);}
.msg{font-size:13px;padding:9px 12px;border-radius:9px;margin-bottom:10px;display:flex;align-items:center;gap:7px;}
.msg.err{background:#3a1220;color:var(--bad);}
.msg.ok{background:#123a24;color:var(--ok);}
.empty{padding:34px 16px;text-align:center;color:var(--ink-soft);}
.empty i{font-size:28px;display:block;margin-bottom:8px;opacity:.6;}
.spin{display:inline-block;width:15px;height:15px;border-radius:50%;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;animation:sp .7s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
#appArea{display:none;}
</style>
</head>

function safeFileName(name){
  name = name || '';
  const dot = name.lastIndexOf('.');
  const ext = dot > -1 ? name.slice(dot).toLowerCase().replace(/[^.a-z0-9]/g,'') : '';
  const base = (dot > -1 ? name.slice(0, dot) : name).replace(/[^\w\-]+/g,'_').replace(/^_+|_+$/g,'').slice(0,40) || 'image';
  return base + (ext || '.jpg');
}
async function compressImage(file, opts){
  const { maxDim = 2000, quality = 0.88, minBytes = 400*1024 } = opts || {};
  try{
    if(!file || !file.type || !file.type.startsWith('image/')) return file;
    if(file.type === 'image/gif' || file.type === 'image/svg+xml') return file;
    if(file.size < minBytes) return file;
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, maxDim / Math.max(bmp.width, bmp.height));
    const w = Math.max(1, Math.round(bmp.width * scale)), h = Math.max(1, Math.round(bmp.height * scale));
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
    ctx.drawImage(bmp, 0, 0, w, h);
    if(bmp.close) bmp.close();
    const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', quality));
    if(!blob || blob.size >= file.size) return file;
    return new File([blob], safeFileName(file.name).replace(/\.[^.]+$/, '') + '.jpg', { type:'image/jpeg' });
  }catch(e){ return file; }
}

async function checkSession(){
  const { data:{session} } = await sb.auth.getSession();
  if(!session){ showLogin(); return; }
  me = session.user;
  const { data: profile, error } = await sb.from('profiles').select('*').eq('id', me.id).maybeSingle();
  meProfile = profile;
  if(error){ $('#loginMsg').innerHTML = `<div class="msg err"><i class="ph ph-warning-circle"></i> ${esc(error.message)}</div>`; showLogin(); return; }
  if(!profile || (profile.role!=='admin' && profile.role!=='owner')){
    $('#loginMsg').innerHTML = '<div class="msg err"><i class="ph ph-warning-circle"></i> هذا الحساب ليس لديه صلاحيات إدارية.</div>';
    await sb.auth.signOut();
    showLogin(); return;
  }
  showApp();
}
function showLogin(){ $('#loginArea').style.display='block'; $('#appArea').style.display='none'; }
function showApp(){ $('#loginArea').style.display='none'; $('#appArea').style.display='block'; loadStats(); renderTab(); }

}

async function renderTab(){
  const panel = $('#panel');
  panel.innerHTML = `<div class="empty"><span class="spin"></span></div>`;
  if(tab==='posts'){
    const { data, error } = await sb.from('content_items').select('*, artist:profiles!content_items_artist_id_fkey(username, role, is_verified)').is('deleted_at', null).order('created_at',{ascending:false});
    if(error){ panel.innerHTML = `<div class="msg err"><i class="ph ph-warning-circle"></i> فشل التحميل: ${esc(error.message)}</div>`; return; }
    postsCache = data||[];
    renderPostsPanel();
  } else if(tab==='trash'){
    const { data, error } = await sb.from('content_items').select('*, artist:profiles!content_items_artist_id_fkey(username, role, is_verified)').not('deleted_at','is',null).order('deleted_at',{ascending:false});
    if(error){ panel.innerHTML = `<div class="msg err"><i class="ph ph-warning-circle"></i> ${esc(error.message)}</div>`; return; }
    panel.innerHTML = (data&&data.length) ? data.map(trashRow).join('') : `<div class="empty"><i class="ph ph-trash"></i>سلة المحذوفات فارغة.</div>`;
    data && data.forEach(it=> wireTrashRow(it));
  } else if(tab==='reports'){
    const { data, error } = await sb.from('reports').select('*, content:content_items(id, title, image_url, deleted_at), reporter:profiles(username)').order('created_at',{ascending:false});
    if(error){ panel.innerHTML = `<div class="msg err"><i class="ph ph-warning-circle"></i> ${esc(error.message)}</div>`; return; }
    panel.innerHTML = (data&&data.length) ? data.map(reportRow).join('') : `<div class="empty"><i class="ph-fill ph-flag"></i>لا توجد بلاغات.</div>`;
    data && data.forEach(r=> wireReportRow(r));
  } else if(tab==='users'){
    const { data, error } = await sb.from('profiles').select('*').order('created_at',{ascending:false});
    if(error){ panel.innerHTML = `<div class="msg err"><i class="ph ph-warning-circle"></i> ${esc(error.message)}</div>`; return; }
    const counts = {};
    (data||[]).forEach(u=>{ const src = u.referral_source || 'غير محدد'; counts[src] = (counts[src]||0)+1; });
    const labels = { instagram:'Instagram', tiktok:'TikTok', facebook:'Facebook', search:'بحث Google', friend:'صديق', other:'أخرى', 'غير محدد':'غير محدد' };
    const referralHtml = Object.keys(counts).length ? `<div class="card" style="margin-bottom:14px;">
      <b style="font-size:13px;color:var(--ink-soft);display:block;margin-bottom:8px;">من أين عرف المستخدمون الموقع</b>
      <div style="display:flex;flex-wrap:wrap;gap:8px;">
        ${Object.entries(counts).map(([k,v])=>`<span class="tagx" style="font-size:12px;padding:5px 12px;">${esc(labels[k]||k)}: ${v}</span>`).join('')}
      </div>
    </div>` : '';
    panel.innerHTML = referralHtml + ((data||[]).map(userRow).join('') || `<div class="empty"><i class="ph ph-users-three"></i>لا يوجد مستخدمون بعد.</div>`);
    (data||[]).forEach(u=> {
      const btn = document.getElementById('ban-'+u.id);
      if(btn) btn.addEventListener('click', ()=> toggleBan(u));
      const rbtn = document.getElementById('saverole-'+u.id);
      if(rbtn) rbtn.addEventListener('click', ()=> saveRole(u));
    });
  } else if(tab==='add'){
    panel.innerHTML = addForm();
    wireAddForm();
  } else if(tab==='broadcast'){
    panel.innerHTML = broadcastForm();
    wireBroadcastForm();
    loadBroadcastHistory();
  } else if(tab==='assets'){
    panel.innerHTML = assetsForm();
    wireAssetsForm();
  } else if(tab==='verify'){
    const { data, error } = await sb.from('verification_requests').select('*, requester:profiles(username, is_verified)').order('created_at',{ascending:false});
    if(error){ panel.innerHTML = `<div class="msg err"><i class="ph ph-warning-circle"></i> ${esc(error.message)}</div>`; return; }
    panel.innerHTML = (data&&data.length) ? data.map(verifyRow).join('') : `<div class="empty"><i class="ph-fill ph-seal-check"></i>لا توجد طلبات توثيق.</div>`;
    data && data.forEach(v=> wireVerifyRow(v));
  }
}

function roleBadgeSmall(p){

  if(p.role==='admin') return `<img src="${BADGE_ADMIN_IMG}" class="role-badge-img" title="مسؤول">`;
  if(p.role==='artist') return `<img src="${BADGE_ARTIST_IMG}" class="role-badge-img" title="فنان موثّق">`;

  return '';
}

let postsCache = [];
let selectedPostIds = new Set();
function renderPostsPanel(){
  const panel = $('#panel');
  const typeOptions = ['brush','palette','reference','project','announcement'];
  panel.innerHTML = `
    <div class="filter-bar">
      <input type="search" id="postSearch" placeholder="ابحث بالعنوان أو اسم الفنان...">
      <select id="postTypeFilter"><option value="">كل الأنواع</option>${typeOptions.map(t=>`<option value="${t}">${esc(t)}</option>`).join('')}</select>
      <input type="date" id="postFromDate" title="من تاريخ">
      <input type="date" id="postToDate" title="إلى تاريخ">
    </div>
    <div class="select-row">
      <input type="checkbox" id="selectAllPosts">
      <label for="selectAllPosts" style="color:var(--ink-soft);font-size:13px;">تحديد الكل</label>
    </div>
    <div class="bulk-bar" id="bulkBar">
      <span id="bulkCount" style="font-size:13px;color:var(--ink-soft);"></span>
      <button class="btn btn-bad" id="bulkDeleteBtn"><i class="ph ph-trash"></i> حذف المحدد</button>
    </div>
    <div id="postsList"></div>
  `;
  $('#postSearch').addEventListener('input', ()=> applyPostsFilter());
  $('#postTypeFilter').addEventListener('change', ()=> applyPostsFilter());
  $('#postFromDate').addEventListener('change', ()=> applyPostsFilter());
  $('#postToDate').addEventListener('change', ()=> applyPostsFilter());
  $('#selectAllPosts').addEventListener('change', (e)=>{
    const visible = getFilteredPosts();
    if(e.target.checked) visible.forEach(it=> selectedPostIds.add(it.id));
    else visible.forEach(it=> selectedPostIds.delete(it.id));
    applyPostsFilter();
  });
  $('#bulkDeleteBtn').addEventListener('click', async ()=>{
    if(selectedPostIds.size===0) return;
    if(!confirm(`نقل ${selectedPostIds.size} منشور إلى سلة المحذوفات؟`)) return;
    const ids = [...selectedPostIds];
    const { error } = await sb.from('content_items').update({ deleted_at: new Date().toISOString() }).in('id', ids);
    if(error){ alert(error.message); return; }
    selectedPostIds.clear();
    loadStats(); renderTab();
  });
  selectedPostIds.clear();
  applyPostsFilter();
}
function getFilteredPosts(){
  const q = ($('#postSearch')?.value||'').trim().toLowerCase();
  const type = $('#postTypeFilter')?.value||'';
  const from = $('#postFromDate')?.value||'';
  const to = $('#postToDate')?.value||'';
  return postsCache.filter(it=>{
    if(type && it.type!==type) return false;
    if(q){
      const uname = (it.artist?.username||'').toLowerCase();
      if(!(it.title||'').toLowerCase().includes(q) && !uname.includes(q)) return false;
    }
    if(from && new Date(it.created_at) < new Date(from)) return false;
    if(to && new Date(it.created_at) > new Date(to+'T23:59:59')) return false;
    return true;
  });
}

      if(upErr){ msg.innerHTML = `<div class="msg err">${esc(upErr.message)}</div>`; return; }
      const url = sb.storage.from('content-media').getPublicUrl(path).data.publicUrl;
      const { error: setErr } = await sb.from('app_settings').upsert({ key, value: url, updated_by: me.id, updated_at: new Date().toISOString() });
      if(setErr){ msg.innerHTML = `<div class="msg err">${esc(setErr.message)}</div>`; return; }
      document.getElementById('preview-'+key).src = url;
      msg.innerHTML = '<div class="msg ok"><i class="ph-fill ph-check-circle"></i> تم التحديث! سيظهر للمستخدمين فوراً.</div>';
    });
  });
}

(function gateCheck(){
  let gated = false;
  try{ gated = sessionStorage.getItem('gp_owner_gate') !== '1'; }catch(e){ gated = false; }
  if(gated){
    document.getElementById('gateArea').style.display = 'block';
    document.getElementById('loginArea').style.display = 'none';
    return;
  }
  checkSession();
})();
</script>
