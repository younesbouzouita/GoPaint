<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#15131F; --surface:#1E1B2E; --surface-2:#282440; --ink:#F4F2FB; --ink-soft:#B4AFC9; --line:#332E4C;
  --blue:#3D6CFF; --purple:#9B4DFF; --pink:#FF4DA6; --grad:linear-gradient(115deg,var(--blue),var(--purple) 55%,var(--pink));
  --ok:#3FCE83; --bad:#FF5C7A; --warn:#FFB13F;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',sans-serif;}
h1,h2,h3{font-family:'Baloo 2',sans-serif;}
.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 60px;}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:10px;flex-wrap:wrap;}
.brand{font-weight:800;font-size:20px;display:flex;align-items:center;gap:9px;}
.brand-mark{width:32px;height:32px;border-radius:50%;background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none;overflow:hidden;}
.brand-mark img{width:100%;height:100%;object-fit:cover;display:block;}
.brand span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
.btn{border:none;cursor:pointer;font-weight:700;border-radius:10px;padding:9px 15px;font-size:13.5px;font-family:inherit;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--grad);color:#fff;}
.btn-ghost{background:var(--surface-2);color:var(--ink);}
.btn-ok{background:var(--ok);color:#0a2617;}
.btn-bad{background:var(--bad);color:#2a0510;}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px;}
.stat-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;}
.stat-box b{display:block;font-size:22px;font-family:'Baloo 2';background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
.stat-box span{font-size:11.5px;color:var(--ink-soft);font-weight:600;}
.tabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap;}
.tabs button{background:var(--surface-2);border:1px solid var(--line);color:var(--ink-soft);padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;}
.tabs button.active{background:var(--grad);color:#fff;border-color:transparent;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;}
.row{display:flex;gap:14px;align-items:flex-start;}
.thumb{width:88px;height:88px;border-radius:12px;object-fit:cover;background:var(--surface-2);flex:none;cursor:pointer;}
.meta{flex:1;min-width:0;}
.meta b{font-size:15px;}
.meta .sub{color:var(--ink-soft);font-size:12.5px;margin-top:2px;}
.tagx{display:inline-block;background:var(--surface-2);color:var(--ink-soft);font-size:11px;padding:2px 8px;border-radius:999px;margin-left:4px;}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.badge{font-size:11px;padding:3px 10px;border-radius:999px;font-weight:700;}
.badge.pending{background:#3a2e12;color:var(--warn);}
.badge.approved{background:#123a24;color:var(--ok);}
.badge.rejected{background:#3a1220;color:var(--bad);}
.role-badge{font-size:13px;margin-right:3px;vertical-align:-2px;}
.role-badge.owner{color:#FF8A3D;}
.role-badge.admin{color:var(--blue);}
.role-badge.artist{color:var(--purple);}
.role-badge.verified{color:var(--pink);}
.select-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.select-row input[type=checkbox]{width:16px;height:16px;}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.filter-bar input,.filter-bar select{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--ink);font-family:inherit;font-size:13px;}
.filter-bar input[type=search]{flex:1;min-width:160px;}
.bulk-bar{position:sticky;top:0;z-index:5;background:var(--surface);border:1px solid var(--purple);border-radius:12px;padding:10px 14px;margin-bottom:12px;display:none;align-items:center;justify-content:space-between;gap:10px;}
.bulk-bar.show{display:flex;}
.item-check{width:18px;height:18px;margin-top:4px;flex:none;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px;font-weight:700;}
.field input,.field select,.field textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--ink);font-family:inherit;font-size:14px;}
.login-box{max-width:380px;margin:80px auto;background:var(--surface);padding:28px;border-radius:18px;border:1px solid var(--line);}
.msg{font-size:13px;padding:9px 12px;border-radius:9px;margin-bottom:10px;display:flex;align-items:center;gap:7px;}
.msg.err{background:#3a1220;color:var(--bad);}
.msg.ok{background:#123a24;color:var(--ok);}
.empty{padding:34px 16px;text-align:center;color:var(--ink-soft);}
.empty i{font-size:28px;display:block;margin-bottom:8px;opacity:.6;}
.spin{display:inline-block;width:15px;height:15px;border-radius:50%;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;animation:sp .7s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
#appArea{display:none;}
</style>

<script>

const SUPABASE_KEY = "sb_publishable_Fv1CzDb7xGCB8sMtD6e4Kw_pKe54UPU";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let me = null, meProfile = null, tab='posts';
const $=s=>document.querySelector(s);
const esc=s=>(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function safeFileName(name){
  name = name || '';
  const dot = name.lastIndexOf('.');
  const ext = dot > -1 ? name.slice(dot).toLowerCase().replace(/[^.a-z0-9]/g,'') : '';
  const base = (dot > -1 ? name.slice(0, dot) : name).replace(/[^\w\-]+/g,'_').replace(/^_+|_+$/g,'').slice(0,40) || 'image';
  return base + (ext || '.jpg');
}
async function compressImage(file, opts){
  const { maxDim = 2000, quality = 0.88, minBytes = 400*1024 } = opts || {};
  try{
    if(!file || !file.type || !file.type.startsWith('image/')) return file;
    if(file.type === 'image/gif' || file.type === 'image/svg+xml') return file;
    if(file.size < minBytes) return file;
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, maxDim / Math.max(bmp.width, bmp.height));
    const w = Math.max(1, Math.round(bmp.width * scale)), h = Math.max(1, Math.round(bmp.height * scale));
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
    ctx.drawImage(bmp, 0, 0, w, h);
    if(bmp.close) bmp.close();
    const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', quality));
    if(!blob || blob.size >= file.size) return file;
    return new File([blob], safeFileName(file.name).replace(/\.[^.]+$/, '') + '.jpg', { type:'image/jpeg' });
  }catch(e){ return file; }
}

async function checkSession(){
  const { data:{session} } = await sb.auth.getSession();
  if(!session){ showLogin(); return; }
  me = session.user;
  const { data: profile, error } = await sb.from('profiles').select('*').eq('id', me.id).maybeSingle();
  meProfile = profile;
  if(error){ $('#loginMsg').innerHTML = `<div class="msg err"><i class="ph ph-warning-circle"></i> ${esc(error.message)}</div>`; showLogin(); return; }
  if(!profile || (profile.role!=='admin' && profile.role!=='owner')){
    $('#loginMsg').innerHTML = '<div class="msg err"><i class="ph ph-warning-circle"></i> هذا الحساب ليس لديه صلاحيات إدارية.</div>';
    await sb.auth.signOut();
    showLogin(); return;
  }
  showApp();
}
function showLogin(){ $('#loginArea').style.display='block'; $('#appArea').style.display='none'; }
function showApp(){ $('#loginArea').style.display='none'; $('#appArea').style.display='block'; loadStats(); renderTab(); }

$('#loginBtn').addEventListener('click', async ()=>{
  const email=$('#lEmail').value.trim(), password=$('#lPass').value;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ $('#loginMsg').innerHTML = `<div class="msg err"><i class="ph ph-warning-circle"></i> ${esc(error.message)}</div>`; return; }
  await checkSession();
});
$('#logoutBtn').addEventListener('click', async ()=>{ await sb.auth.signOut(); location.reload(); });

document.querySelectorAll('.tabs button').forEach(b=> b.addEventListener('click', ()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active', x===b));
  tab = b.dataset.t; renderTab();
}));

async function loadStats(){
  const grid = $('#statsRow');
  const [{ count: totalContent }, { count: openReports }, { count: totalUsers }] = await Promise.all([
    sb.from('content_items').select('*', { count:'exact', head:true }).is('deleted_at', null),
    sb.from('reports').select('*', { count:'exact', head:true }).eq('status','open'),
    sb.from('profiles').select('*', { count:'exact', head:true })
  ]);
  grid.innerHTML = `
    <div class="stat-box"><b>${totalContent ?? 0}</b><span>المنشورات</span></div>
    <div class="stat-box"><b>${openReports ?? 0}</b><span>بلاغات مفتوحة</span></div>
    <div class="stat-box"><b>${totalUsers ?? 0}</b><span>المستخدمون</span></div>`;
  const rb = $('#reportsBadge');
  if(rb) rb.textContent = openReports ? `(${openReports})` : '';
}

async function renderTab(){
  const panel = $('#panel');
  panel.innerHTML = `<div class="empty"><span class="spin"></span></div>`;
  if(tab==='posts'){
    const { data, error } = await sb.from('content_items').select('*, artist:profiles!content_items_artist_id_fkey(username, role, is_verified)').is('deleted_at', null).order('created_at',{ascending:false});
    if(error){ panel.innerHTML = `<div class="msg err"><i class="ph ph-warning-circle"></i> فشل التحميل: ${esc(error.message)}</div>`; return; }
    postsCache = data||[];
    renderPostsPanel();
  } else if(tab==='trash'){
    const { data, error } = await sb.from('content_items').select('*, artist:profiles!content_items_artist_id_fkey(username, role, is_verified)').not('deleted_at','is',null).order('deleted_at',{ascending:false});
    if(error){ panel.innerHTML = `<div class="msg err"><i class="ph ph-warning-circle"></i> ${esc(error.message)}</div>`; return; }
    panel.innerHTML = (data&&data.length) ? data.map(trashRow).join('') : `<div class="empty"><i class="ph ph-trash"></i>سلة المحذوفات فارغة.</div>`;
    data && data.forEach(it=> wireTrashRow(it));
  } else if(tab==='reports'){
    const { data, error } = await sb.from('reports').select('*, content:content_items(id, title, image_url, deleted_at), reporter:profiles(username)').order('created_at',{ascending:false});
    if(error){ panel.innerHTML = `<div class="msg err"><i class="ph ph-warning-circle"></i> ${esc(error.message)}</div>`; return; }
    panel.innerHTML = (data&&data.length) ? data.map(reportRow).join('') : `<div class="empty"><i class="ph-fill ph-flag"></i>لا توجد بلاغات.</div>`;
    data && data.forEach(r=> wireReportRow(r));
  } else if(tab==='users'){
    const { data, error } = await sb.from('profiles').select('*').order('created_at',{ascending:false});
    if(error){ panel.innerHTML = `<div class="msg err"><i class="ph ph-warning-circle"></i> ${esc(error.message)}</div>`; return; }
    const counts = {};
    (data||[]).forEach(u=>{ const src = u.referral_source || 'غير محدد'; counts[src] = (counts[src]||0)+1; });
    const labels = { instagram:'Instagram', tiktok:'TikTok', facebook:'Facebook', search:'بحث Google', friend:'صديق', other:'أخرى', 'غير محدد':'غير محدد' };
    const referralHtml = Object.keys(counts).length ? `<div class="card" style="margin-bottom:14px;">
      <b style="font-size:13px;color:var(--ink-soft);display:block;margin-bottom:8px;">من أين عرف المستخدمون الموقع</b>
      <div style="display:flex;flex-wrap:wrap;gap:8px;">
        ${Object.entries(counts).map(([k,v])=>`<span class="tagx" style="font-size:12px;padding:5px 12px;">${esc(labels[k]||k)}: ${v}</span>`).join('')}
      </div>
    </div>` : '';
    panel.innerHTML = referralHtml + ((data||[]).map(userRow).join('') || `<div class="empty"><i class="ph ph-users-three"></i>لا يوجد مستخدمون بعد.</div>`);
    (data||[]).forEach(u=> {
      const btn = document.getElementById('ban-'+u.id);
      if(btn) btn.addEventListener('click', ()=> toggleBan(u));
      const rbtn = document.getElementById('saverole-'+u.id);
      if(rbtn) rbtn.addEventListener('click', ()=> saveRole(u));
    });
  } else if(tab==='add'){
    panel.innerHTML = addForm();
    wireAddForm();
  } else if(tab==='verify'){
    const { data, error } = await sb.from('verification_requests').select('*, requester:profiles(username, is_verified)').order('created_at',{ascending:false});
    if(error){ panel.innerHTML = `<div class="msg err"><i class="ph ph-warning-circle"></i> ${esc(error.message)}</div>`; return; }
    panel.innerHTML = (data&&data.length) ? data.map(verifyRow).join('') : `<div class="empty"><i class="ph-fill ph-seal-check"></i>لا توجد طلبات توثيق.</div>`;
    data && data.forEach(v=> wireVerifyRow(v));
  }
}

function roleBadgeSmall(p){
  if(!p) return '';
  if(p.role==='owner') return '<i class="ph-fill ph-crown-simple role-badge owner" title="مالك"></i>';
  if(p.role==='admin') return '<i class="ph-fill ph-shield-check role-badge admin" title="مسؤول"></i>';
  if(p.role==='artist') return '<i class="ph-fill ph-paint-brush-broad role-badge artist" title="فنان موثّق"></i>';
  if(p.is_verified) return '<i class="ph-fill ph-seal-check role-badge verified" title="موثّق"></i>';
  return '';
}

/* ---------------- POSTS (search/filter/bulk/soft-delete) ---------------- */
let postsCache = [];
let selectedPostIds = new Set();
function renderPostsPanel(){
  const panel = $('#panel');
  const typeOptions = ['brush','palette','reference','project','announcement'];
  panel.innerHTML = `
    <div class="filter-bar">
      <input type="search" id="postSearch" placeholder="ابحث بالعنوان أو اسم الفنان...">
      <select id="postTypeFilter"><option value="">كل الأنواع</option>${typeOptions.map(t=>`<option value="${t}">${esc(t)}</option>`).join('')}</select>
      <input type="date" id="postFromDate" title="من تاريخ">
      <input type="date" id="postToDate" title="إلى تاريخ">
    </div>
    <div class="select-row">
      <input type="checkbox" id="selectAllPosts">
      <label for="selectAllPosts" style="color:var(--ink-soft);font-size:13px;">تحديد الكل</label>
    </div>
    <div class="bulk-bar" id="bulkBar">
      <span id="bulkCount" style="font-size:13px;color:var(--ink-soft);"></span>
      <button class="btn btn-bad" id="bulkDeleteBtn"><i class="ph ph-trash"></i> حذف المحدد</button>
    </div>
    <div id="postsList"></div>
  `;
  $('#postSearch').addEventListener('input', ()=> applyPostsFilter());
  $('#postTypeFilter').addEventListener('change', ()=> applyPostsFilter());
  $('#postFromDate').addEventListener('change', ()=> applyPostsFilter());
  $('#postToDate').addEventListener('change', ()=> applyPostsFilter());
  $('#selectAllPosts').addEventListener('change', (e)=>{
    const visible = getFilteredPosts();
    if(e.target.checked) visible.forEach(it=> selectedPostIds.add(it.id));
    else visible.forEach(it=> selectedPostIds.delete(it.id));
    applyPostsFilter();
  });
  $('#bulkDeleteBtn').addEventListener('click', async ()=>{
    if(selectedPostIds.size===0) return;
    if(!confirm(`نقل ${selectedPostIds.size} منشور إلى سلة المحذوفات؟`)) return;
    const ids = [...selectedPostIds];
    const { error } = await sb.from('content_items').update({ deleted_at: new Date().toISOString() }).in('id', ids);
    if(error){ alert(error.message); return; }
    selectedPostIds.clear();
    loadStats(); renderTab();
  });
  selectedPostIds.clear();
  applyPostsFilter();
}
function getFilteredPosts(){
  const q = ($('#postSearch')?.value||'').trim().toLowerCase();
  const type = $('#postTypeFilter')?.value||'';
  const from = $('#postFromDate')?.value||'';
  const to = $('#postToDate')?.value||'';
  return postsCache.filter(it=>{
    if(type && it.type!==type) return false;
    if(q){
      const uname = (it.artist?.username||'').toLowerCase();
      if(!(it.title||'').toLowerCase().includes(q) && !uname.includes(q)) return false;
    }
    if(from && new Date(it.created_at) < new Date(from)) return false;
    if(to && new Date(it.created_at) > new Date(to+'T23:59:59')) return false;
    return true;
  });
}
function applyPostsFilter(){
  const list = getFilteredPosts();
  const listEl = $('#postsList');
  listEl.innerHTML = list.length ? list.map(itemRow).join('') : `<div class="empty"><i class="ph ph-tray"></i>لا توجد نتائج.</div>`;
  list.forEach(it=> wireRow(it));
  const bulkBar = $('#bulkBar');
  if(selectedPostIds.size>0){ bulkBar.classList.add('show'); $('#bulkCount').textContent = `${selectedPostIds.size} محدد`; }
  else bulkBar.classList.remove('show');
}

function verifyRow(v){
  const uname = v.requester ? v.requester.username : '—';
  return `<div class="card" id="vrow-${v.id}">
    <div class="meta">
      <b>${esc(uname)}</b> <span class="badge ${v.status}">${v.status}</span>
      <div class="sub">متابعون: ${v.followers_at_request} · إعجابات: ${v.likes_at_request} · منشورات: ${v.posts_at_request}</div>
      <div class="sub" style="margin-top:6px;color:var(--ink);">"${esc(v.reason)}"</div>
      <div class="actions">
        ${v.status!=='approved'?`<button class="btn btn-ok" data-act="approve" data-id="${v.id}" data-uid="${v.user_id}"><i class="ph-fill ph-check-circle"></i> قبول وتوثيق</button>`:''}
        ${v.status!=='rejected'?`<button class="btn btn-bad" data-act="reject" data-id="${v.id}"><i class="ph ph-x-circle"></i> رفض</button>`:''}
      </div>
    </div>
  </div>`;
}
function wireVerifyRow(v){
  const row = document.getElementById('vrow-'+v.id); if(!row) return;
  row.querySelectorAll('button[data-act]').forEach(b=> b.addEventListener('click', async ()=>{
    const act = b.dataset.act;
    let error = null;
    if(act==='approve'){
      ({ error } = await sb.from('verification_requests').update({ status:'approved' }).eq('id', v.id));
      if(!error) ({ error } = await sb.from('profiles').update({ is_verified:true }).eq('id', b.dataset.uid));
    }
    if(act==='reject'){
      const note = prompt('سبب الرفض (اختياري):') || null;
      ({ error } = await sb.from('verification_requests').update({ status:'rejected', admin_note:note }).eq('id', v.id));
    }
    if(error){ alert(error.message); return; }
    renderTab();
  }));
}

function itemRow(it){
  const uname = it.artist ? it.artist.username : '—';
  const badge = roleBadgeSmall(it.artist);
  const checked = selectedPostIds.has(it.id) ? 'checked' : '';
  return `<div class="card" id="row-${it.id}">
    <div class="row">
      <input type="checkbox" class="item-check" data-id="${it.id}" ${checked}>
      ${it.image_url?`<img class="thumb" src="${it.image_url}" onclick="window.open('${it.image_url}','_blank')">`:''}
      <div class="meta">
        <b>${esc(it.title)}</b>
        <div class="sub">النوع: ${esc(it.type)} ${it.subcategory?('· '+esc(it.subcategory)):''} — بواسطة ${badge}${esc(uname)}</div>
        <div style="margin-top:4px;">${(it.tags||[]).map(t=>`<span class="tagx">${esc(t)}</span>`).join('')}</div>
        <div class="actions">
          ${it.file_url?`<button class="btn btn-ghost" data-act="editlabel" data-id="${it.id}"><i class="ph ph-pencil-simple"></i> تعديل نص المرفق</button>`:''}
          <button class="btn btn-bad" data-act="delete" data-id="${it.id}"><i class="ph ph-trash"></i> حذف</button>
        </div>
      </div>
    </div>
  </div>`;
}
function wireRow(it){
  const row = document.getElementById('row-'+it.id); if(!row) return;
  const check = row.querySelector('.item-check');
  if(check) check.addEventListener('change', ()=>{
    if(check.checked) selectedPostIds.add(it.id); else selectedPostIds.delete(it.id);
    const bulkBar = $('#bulkBar');
    if(selectedPostIds.size>0){ bulkBar.classList.add('show'); $('#bulkCount').textContent = `${selectedPostIds.size} محدد`; }
    else bulkBar.classList.remove('show');
  });
  row.querySelectorAll('button[data-act]').forEach(b=> b.addEventListener('click', async ()=>{
    const act = b.dataset.act;
    let error = null;
    if(act==='editlabel'){
      const label = prompt('نص زر المرفق (اتركه فارغاً لاستخدام الافتراضي "فتح المرفق"):', it.file_label || '');
      if(label===null) return;
      ({ error } = await sb.from('content_items').update({ file_label: label.trim() || null }).eq('id', it.id));
    }
    if(act==='delete'){
      if(!confirm('نقل هذا المنشور إلى سلة المحذوفات؟')) return;
      ({ error } = await sb.from('content_items').update({ deleted_at: new Date().toISOString() }).eq('id', it.id));
    }
    if(error){ alert(error.message); return; }
    loadStats(); renderTab();
  }));
}
function trashRow(it){
  const uname = it.artist ? it.artist.username : '—';
  const badge = roleBadgeSmall(it.artist);
  const deletedDate = it.deleted_at ? new Date(it.deleted_at).toLocaleDateString('ar') : '';
  return `<div class="card" id="trow-${it.id}">
    <div class="row">
      ${it.image_url?`<img class="thumb" src="${it.image_url}" onclick="window.open('${it.image_url}','_blank')">`:''}
      <div class="meta">
        <b>${esc(it.title)}</b>
        <div class="sub">بواسطة ${badge}${esc(uname)} — حُذف في ${deletedDate}</div>
        <div class="actions">
          <button class="btn btn-ok" data-act="restore" data-id="${it.id}"><i class="ph ph-arrow-counter-clockwise"></i> استرجاع</button>
          <button class="btn btn-bad" data-act="permadelete" data-id="${it.id}"><i class="ph ph-trash"></i> حذف نهائي</button>
        </div>
      </div>
    </div>
  </div>`;
}
function wireTrashRow(it){
  const row = document.getElementById('trow-'+it.id); if(!row) return;
  row.querySelectorAll('button[data-act]').forEach(b=> b.addEventListener('click', async ()=>{
    const act = b.dataset.act;
    let error = null;
    if(act==='restore') ({ error } = await sb.from('content_items').update({ deleted_at: null }).eq('id', it.id));
    if(act==='permadelete'){
      if(!confirm('حذف نهائي لا يمكن التراجع عنه. متابعة؟')) return;
      ({ error } = await sb.from('content_items').delete().eq('id', it.id));
    }
    if(error){ alert(error.message); return; }
    loadStats(); renderTab();
  }));
}
function reportRow(r){
  const content = r.content;
  const reporter = r.reporter ? r.reporter.username : (r.reporter_id ? '—' : 'مستخدم محذوف');
  const alreadyDeleted = content && content.deleted_at;
  return `<div class="card" id="reprow-${r.id}">
    <div class="row">
      ${content && content.image_url?`<img class="thumb" src="${content.image_url}" onclick="window.open('${content.image_url}','_blank')">`:''}
      <div class="meta">
        <b>${content?esc(content.title):'(منشور محذوف)'}</b> <span class="badge ${r.status==='open'?'pending':(r.status==='resolved'?'approved':'rejected')}">${r.status}</span>
        <div class="sub">بلاغ من: ${esc(reporter)}</div>
        <div class="sub" style="margin-top:6px;color:var(--ink);">"${esc(r.reason)}"</div>
        <div class="actions">
          ${(r.status==='open' && content && !alreadyDeleted)?`<button class="btn btn-bad" data-act="deletecontent" data-id="${r.id}" data-cid="${content.id}"><i class="ph ph-trash"></i> حذف المنشور</button>`:''}
          ${r.status==='open'?`<button class="btn btn-ghost" data-act="dismiss" data-id="${r.id}"><i class="ph ph-x"></i> تجاهل</button>`:''}
        </div>
      </div>
    </div>
  </div>`;
}
function wireReportRow(r){
  const row = document.getElementById('reprow-'+r.id); if(!row) return;
  row.querySelectorAll('button[data-act]').forEach(b=> b.addEventListener('click', async ()=>{
    const act = b.dataset.act;
    let error = null;
    if(act==='deletecontent'){
      if(!confirm('نقل هذا المنشور إلى سلة المحذوفات؟')) return;
      ({ error } = await sb.from('content_items').update({ deleted_at: new Date().toISOString() }).eq('id', b.dataset.cid));
      if(!error) ({ error } = await sb.from('reports').update({ status:'resolved' }).eq('id', r.id));
    }
    if(act==='dismiss'){
      ({ error } = await sb.from('reports').update({ status:'dismissed' }).eq('id', r.id));
    }
    if(error){ alert(error.message); return; }
    loadStats(); renderTab();
  }));
}
function userRow(u){
  const roleBadgeHtml = roleBadgeSmall(u);
  const roleOptions = ['user','artist','admin','owner'].map(r=>`<option value="${r}" ${u.role===r?'selected':''}>${r}</option>`).join('');
  return `<div class="card">
    <div class="row">
      <div class="meta">
        <b>${roleBadgeHtml}${esc(u.username)}</b> <span class="badge ${u.is_banned?'rejected':'approved'}">${u.is_banned?'محظور':'نشط'}</span>
        <div class="actions" style="align-items:center;">
          <select id="role-${u.id}" style="width:auto;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:7px 10px;font-family:inherit;font-size:13px;">${roleOptions}</select>
          <button class="btn btn-ghost" id="saverole-${u.id}"><i class="ph ph-check"></i> حفظ الدور</button>
          <button class="btn ${u.is_banned?'btn-ok':'btn-bad'}" id="ban-${u.id}"><i class="ph ${u.is_banned?'ph-check-circle':'ph-prohibit'}"></i> ${u.is_banned?'إلغاء الحظر':'حظر'}</button>
        </div>
      </div>
    </div>
  </div>`;
}
async function toggleBan(u){
  const { error } = await sb.from('profiles').update({ is_banned: !u.is_banned }).eq('id', u.id);
  if(error){ alert(error.message); return; }
  renderTab();
}
async function saveRole(u){
  const sel = document.getElementById('role-'+u.id);
  const newRole = sel.value;
  if(newRole===u.role) return;
  if(!confirm(`تأكيد تغيير دور ${u.username} إلى ${newRole}؟`)) return;
  const { error } = await sb.from('profiles').update({ role: newRole }).eq('id', u.id);
  if(error){ alert(error.message); return; }
  renderTab();
}
function addForm(){
  return `<div class="card">
    <div class="field"><label>النوع</label>
      <select id="aType"><option value="brush">فرشاة</option><option value="palette">ألوان</option><option value="reference">مرجع</option><option value="announcement">نص / إعلان</option></select>
    </div>
    <div class="field"><label>العنوان</label><input id="aTitle"></div>
    <div class="field"><label>النص / الوصف</label><textarea id="aDesc" rows="4"></textarea></div>
    <div class="field"><label>صورة (اختياري)</label><input type="file" id="aImage" accept="image/*"></div>
    <div class="field"><label>ملف مرفق — أي نوع (اختياري)</label><input type="file" id="aFile"></div>
    <div class="field"><label>أو رابط خارجي (اختياري)</label><input id="aLink" placeholder="https://..."></div>
    <div class="field"><label>نص زر المرفق (اختياري، الافتراضي "فتح المرفق")</label><input id="aFileLabel" placeholder="فتح المرفق"></div>
    <div class="field"><label>المصدر</label><input id="aSource" placeholder="Pinterest"></div>
    <div class="field"><label>وسوم (فاصلة)</label><input id="aTags"></div>
    <div id="addMsg"></div>
    <button class="btn btn-primary" id="aSubmit"><i class="ph ph-upload-simple"></i> نشر مباشرة</button>
  </div>`;
}
function wireAddForm(){
  $('#aSubmit').addEventListener('click', async ()=>{
    const msg = $('#addMsg'); msg.innerHTML='';
    const title = $('#aTitle').value.trim();
    if(!title){ msg.innerHTML = '<div class="msg err"><i class="ph ph-warning-circle"></i> أدخل عنواناً</div>'; return; }
    let image_url = null;
    let img = $('#aImage').files[0];
    if(img){
      img = await compressImage(img, { maxDim: 2000, quality: 0.88 });
      const path = `admin/${Date.now()}-${safeFileName(img.name)}`;
      const { error: upErr } = await sb.storage.from('content-media').upload(path, img);
      if(upErr){ msg.innerHTML = `<div class="msg err"><i class="ph ph-warning-circle"></i> ${esc(upErr.message)}</div>`; return; }
      image_url = sb.storage.from('content-media').getPublicUrl(path).data.publicUrl;
    }
    let file_url = $('#aLink').value.trim() || null;
    const attach = $('#aFile').files[0];
    if(attach){
      const path = `admin/files/${Date.now()}-${attach.name}`;
      const { error: upErr } = await sb.storage.from('content-media').upload(path, attach);
      if(upErr){ msg.innerHTML = `<div class="msg err"><i class="ph ph-warning-circle"></i> ${esc(upErr.message)}</div>`; return; }
      file_url = sb.storage.from('content-media').getPublicUrl(path).data.publicUrl;
    }
    const payload = {
      type: $('#aType').value, title, description: $('#aDesc').value.trim()||null,
      artist_id: me.id, image_url, file_url,
      file_label: $('#aFileLabel').value.trim()||null,
      source_name: $('#aSource').value.trim()||null,
      tags: $('#aTags').value.split(',').map(t=>t.trim()).filter(Boolean),
      status: 'approved'
    };
    const { error } = await sb.from('content_items').insert(payload);
    if(error){ msg.innerHTML = `<div class="msg err"><i class="ph ph-warning-circle"></i> ${esc(error.message)}</div>`; return; }
    msg.innerHTML = '<div class="msg ok"><i class="ph-fill ph-check-circle"></i> تم النشر مباشرة!</div>';
    setTimeout(()=>{ loadStats(); renderTab(); }, 900);
  });
}

checkSession();
