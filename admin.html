<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GO Paint! — لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
:root{
  --bg:#15131F; --surface:#1E1B2E; --surface-2:#282440; --ink:#F4F2FB; --ink-soft:#B4AFC9; --line:#332E4C;
  --blue:#3D6CFF; --purple:#9B4DFF; --pink:#FF4DA6; --grad:linear-gradient(115deg,var(--blue),var(--purple) 55%,var(--pink));
  --ok:#3FCE83; --bad:#FF5C7A; --warn:#FFB13F;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',sans-serif;}
h1,h2,h3{font-family:'Baloo 2',sans-serif;}
.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 60px;}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;}
.brand{font-weight:800;font-size:20px;}
.brand span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
.btn{border:none;cursor:pointer;font-weight:700;border-radius:10px;padding:9px 15px;font-size:13.5px;font-family:inherit;}
.btn-primary{background:var(--grad);color:#fff;}
.btn-ghost{background:var(--surface-2);color:var(--ink);}
.btn-ok{background:var(--ok);color:#0a2617;}
.btn-bad{background:var(--bad);color:#2a0510;}
.tabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap;}
.tabs button{background:var(--surface-2);border:1px solid var(--line);color:var(--ink-soft);padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:700;font-size:13.5px;}
.tabs button.active{background:var(--grad);color:#fff;border-color:transparent;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;}
.row{display:flex;gap:14px;align-items:flex-start;}
.thumb{width:70px;height:70px;border-radius:10px;object-fit:cover;background:var(--surface-2);flex:none;}
.meta{flex:1;}
.meta b{font-size:15px;}
.meta .sub{color:var(--ink-soft);font-size:12.5px;margin-top:2px;}
.tagx{display:inline-block;background:var(--surface-2);color:var(--ink-soft);font-size:11px;padding:2px 8px;border-radius:999px;margin-left:4px;}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.badge{font-size:11px;padding:3px 10px;border-radius:999px;font-weight:700;}
.badge.pending{background:#3a2e12;color:var(--warn);}
.badge.approved{background:#123a24;color:var(--ok);}
.badge.rejected{background:#3a1220;color:var(--bad);}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px;font-weight:700;}
.field input,.field select,.field textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--ink);font-family:inherit;font-size:14px;}
.login-box{max-width:380px;margin:80px auto;background:var(--surface);padding:28px;border-radius:18px;border:1px solid var(--line);}
.msg{font-size:13px;padding:9px 12px;border-radius:9px;margin-bottom:10px;}
.msg.err{background:#3a1220;color:var(--bad);}
.msg.ok{background:#123a24;color:var(--ok);}
#appArea{display:none;}
</style>
</head>
<body>

<div class="wrap" id="loginArea">
  <div class="login-box">
    <h3 class="brand">GO Paint! <span>Admin</span></h3>
    <p style="color:var(--ink-soft);font-size:13.5px;">هذه اللوحة مخصصة للمسؤولين فقط.</p>
    <div id="loginMsg"></div>
    <div class="field"><label>البريد الإلكتروني</label><input id="lEmail" type="email"></div>
    <div class="field"><label>كلمة السر</label><input id="lPass" type="password"></div>
    <button class="btn btn-primary" style="width:100%" id="loginBtn">دخول</button>
  </div>
</div>

<div class="wrap" id="appArea">
  <div class="head">
    <div class="brand">GO Paint! <span>Admin</span></div>
    <button class="btn btn-ghost" id="logoutBtn">تسجيل الخروج</button>
  </div>
  <div class="tabs">
    <button data-t="pending" class="active">قيد المراجعة</button>
    <button data-t="all">كل المحتوى</button>
    <button data-t="users">المستخدمون</button>
    <button data-t="add">إضافة مباشرة</button>
  </div>
  <div id="panel"></div>
</div>

<script>
const SUPABASE_URL = "https://cdxkktwewqtvttlyjolb.supabase.co";
const SUPABASE_KEY = "sb_publishable_Fv1CzDb7xGCB8sMtD6e4Kw_pKe54UPU";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let me = null, meProfile = null, tab='pending';
const $=s=>document.querySelector(s);
const esc=s=>(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

async function checkSession(){
  const { data:{session} } = await sb.auth.getSession();
  if(!session){ showLogin(); return; }
  me = session.user;
  const { data: profile } = await sb.from('profiles').select('*').eq('id', me.id).maybeSingle();
  meProfile = profile;
  if(!profile || profile.role!=='admin'){
    $('#loginMsg').innerHTML = '<div class="msg err">هذا الحساب ليس لديه صلاحيات إدارية.</div>';
    await sb.auth.signOut();
    showLogin(); return;
  }
  showApp();
}
function showLogin(){ $('#loginArea').style.display='block'; $('#appArea').style.display='none'; }
function showApp(){ $('#loginArea').style.display='none'; $('#appArea').style.display='block'; renderTab(); }

$('#loginBtn').addEventListener('click', async ()=>{
  const email=$('#lEmail').value.trim(), password=$('#lPass').value;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ $('#loginMsg').innerHTML = `<div class="msg err">${error.message}</div>`; return; }
  await checkSession();
});
$('#logoutBtn').addEventListener('click', async ()=>{ await sb.auth.signOut(); location.reload(); });

document.querySelectorAll('.tabs button').forEach(b=> b.addEventListener('click', ()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active', x===b));
  tab = b.dataset.t; renderTab();
}));

async function renderTab(){
  const panel = $('#panel');
  if(tab==='pending' || tab==='all'){
    let q = sb.from('content_items').select('*, artist:profiles(username)').order('created_at',{ascending:false});
    if(tab==='pending') q = q.eq('status','pending');
    const { data } = await q;
    panel.innerHTML = (data&&data.length) ? data.map(itemRow).join('') : `<div class="card">لا يوجد شيء هنا حالياً.</div>`;
    data && data.forEach(it=> wireRow(it));
  } else if(tab==='users'){
    const { data } = await sb.from('profiles').select('*').order('created_at',{ascending:false});
    panel.innerHTML = (data||[]).map(userRow).join('');
    (data||[]).forEach(u=> {
      const btn = document.getElementById('ban-'+u.id);
      if(btn) btn.addEventListener('click', ()=> toggleBan(u));
    });
  } else if(tab==='add'){
    panel.innerHTML = addForm();
    wireAddForm();
  }
}

function itemRow(it){
  const uname = it.artist ? it.artist.username : '—';
  return `<div class="card" id="row-${it.id}">
    <div class="row">
      ${it.image_url?`<img class="thumb" src="${it.image_url}">`:''}
      <div class="meta">
        <b>${esc(it.title)}</b> <span class="badge ${it.status}">${it.status}</span>
        <div class="sub">النوع: ${it.type} ${it.subcategory?('· '+it.subcategory):''} — بواسطة ${esc(uname)}</div>
        <div style="margin-top:4px;">${(it.tags||[]).map(t=>`<span class="tagx">${esc(t)}</span>`).join('')}</div>
        <div class="actions">
          ${it.status!=='approved'?`<button class="btn btn-ok" data-act="approve" data-id="${it.id}">قبول</button>`:''}
          ${it.status!=='rejected'?`<button class="btn btn-bad" data-act="reject" data-id="${it.id}">رفض</button>`:''}
          <button class="btn btn-ghost" data-act="delete" data-id="${it.id}">حذف</button>
        </div>
      </div>
    </div>
  </div>`;
}
function wireRow(it){
  const row = document.getElementById('row-'+it.id); if(!row) return;
  row.querySelectorAll('button[data-act]').forEach(b=> b.addEventListener('click', async ()=>{
    const act = b.dataset.act;
    if(act==='approve') await sb.from('content_items').update({status:'approved'}).eq('id', it.id);
    if(act==='reject'){
      const reason = prompt('سبب الرفض (اختياري):') || null;
      await sb.from('content_items').update({status:'rejected', rejection_reason:reason}).eq('id', it.id);
    }
    if(act==='delete'){ if(!confirm('تأكيد الحذف؟')) return; await sb.from('content_items').delete().eq('id', it.id); }
    renderTab();
  }));
}
function userRow(u){
  return `<div class="card">
    <div class="row">
      <div class="meta">
        <b>${esc(u.username)}</b> <span class="badge ${u.is_banned?'rejected':'approved'}">${u.is_banned?'محظور':'نشط'}</span> — دور: ${u.role}
        <div class="actions">
          <button class="btn ${u.is_banned?'btn-ok':'btn-bad'}" id="ban-${u.id}">${u.is_banned?'إلغاء الحظر':'حظر'}</button>
        </div>
      </div>
    </div>
  </div>`;
}
async function toggleBan(u){
  await sb.from('profiles').update({ is_banned: !u.is_banned }).eq('id', u.id);
  renderTab();
}
function addForm(){
  return `<div class="card">
    <div class="field"><label>النوع</label>
      <select id="aType"><option value="brush">فرشاة</option><option value="palette">ألوان</option><option value="reference">مرجع</option></select>
    </div>
    <div class="field"><label>العنوان</label><input id="aTitle"></div>
    <div class="field"><label>الوصف</label><textarea id="aDesc"></textarea></div>
    <div class="field"><label>صورة كاملة (تحتوي على QR والمعاينة)</label><input type="file" id="aImage" accept="image/*"></div>
    <div class="field"><label>المصدر</label><input id="aSource" placeholder="Pinterest"></div>
    <div class="field"><label>وسوم (فاصلة)</label><input id="aTags"></div>
    <div id="addMsg"></div>
    <button class="btn btn-primary" id="aSubmit">نشر مباشرة</button>
  </div>`;
}
function wireAddForm(){
  $('#aSubmit').addEventListener('click', async ()=>{
    const msg = $('#addMsg'); msg.innerHTML='';
    const title = $('#aTitle').value.trim();
    if(!title){ msg.innerHTML = '<div class="msg err">أدخل عنواناً</div>'; return; }
    let image_url = null;
    const file = $('#aImage').files[0];
    if(file){
      const path = `admin/${Date.now()}-${file.name}`;
      const { error: upErr } = await sb.storage.from('content-media').upload(path, file);
      if(upErr){ msg.innerHTML = `<div class="msg err">${upErr.message}</div>`; return; }
      image_url = sb.storage.from('content-media').getPublicUrl(path).data.publicUrl;
    }
    const payload = {
      type: $('#aType').value, title, description: $('#aDesc').value.trim()||null,
      artist_id: me.id, image_url,
      source_name: $('#aSource').value.trim()||null,
      tags: $('#aTags').value.split(',').map(t=>t.trim()).filter(Boolean),
      status: 'approved'
    };
    const { error } = await sb.from('content_items').insert(payload);
    if(error){ msg.innerHTML = `<div class="msg err">${error.message}</div>`; return; }
    msg.innerHTML = '<div class="msg ok">تم النشر مباشرة!</div>';
    setTimeout(()=>renderTab(), 900);
  });
}

checkSession();
</script>
</body>
</html>
